<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historial de Asistencia</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f1f5f9;color:#0f172a;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.bar{background:#fff;border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:end;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.bar label{font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:3px}
input{padding:9px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:14px}
button{padding:9px 12px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
button.sec{background:#e2e8f0;color:#0f172a}
.kpis{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.kpi{background:#fff;border-radius:12px;padding:10px 16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.kpi b{font-size:22px;display:block}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
th,td{padding:9px 12px;text-align:left;font-size:14px;border-bottom:1px solid #e2e8f0}
th{background:#0f172a;color:#fff;position:sticky;top:0}
.wrap{max-height:65vh;overflow:auto;border-radius:12px}
h2{font-size:15px;margin:16px 0 6px}
.muted{color:#64748b;font-size:13px}
</style>
<script>
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbzAHX63o9edCN8VJkxQvwDdg5_qcV9lZW8a2AwjC4lcgyP4_KABmGj3_YUvaJQh_qygDw/exec';
  function mk(ok, fail){
    return new Proxy({}, { get: function(_, fn){
      if (fn === 'withSuccessHandler') return function(f){ return mk(f, fail); };
      if (fn === 'withFailureHandler') return function(f){ return mk(ok, f); };
      return function(){
        var args = [].slice.call(arguments);
        fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) })
          .then(function(r){ return r.json(); })
          .then(function(j){
            if (j.error) { if (fail) fail({ message: j.error }); }
            else if (ok) { ok(j.result); }
          })
          .catch(function(e){ if (fail) fail({ message: 'Sin conexión con el servidor (' + e.message + ')' }); });
      };
    }});
  }
  window.google = { script: { run: mk(null, null) } };
})();
</script>
</head>
<body>
<h1>Historial de Asistencia</h1>
<div class="bar">
  <div><label>Desde</label><input type="date" id="desde"></div>
  <div><label>Hasta</label><input type="date" id="hasta"></div>
  <div><label>Buscar nombre</label><input type="text" id="q" placeholder="Ej. Juan"></div>
  <button onclick="rango('hoy')">Hoy</button>
  <button onclick="rango('semana')">Esta semana</button>
  <button onclick="rango('mes')">Este mes</button>
  <button class="sec" onclick="rango('todo')">Todo</button>
  <button class="sec" onclick="csv()">Descargar CSV</button>
  <button style="background:#7c3aed" onclick="reporteCsv()">Descargar reporte de faltas</button>
  <button style="background:#16a34a" onclick="abrir(0)">+ Agregar asistencia</button>
  <button style="background:#0891b2" onclick="personalUI()">Personal</button>
</div>
<div class="kpis">
  <div class="kpi"><b id="kTotal">0</b>registros</div>
  <div class="kpi"><b id="kPers">0</b>personas</div>
  <div class="kpi"><b id="kDias">0</b>días</div>
</div>
<div id="alertas"></div>
<div id="personal" style="display:none;background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)"></div>
<div id="reporte"></div>
<h2>Resumen por persona</h2>
<div class="wrap" style="max-height:30vh"><table id="resumen"></table></div>
<h2>Detalle</h2>
<div class="wrap"><table id="detalle"></table></div>
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:14px;padding:20px;max-width:380px;width:100%">
    <h2 id="mTitulo" style="margin-top:0"></h2>
    <div id="mCampos">
      <label class="muted">Fecha</label><input type="date" id="mFecha" style="width:100%;margin-bottom:8px">
      <label class="muted">Hora (HH:MM:SS)</label><input type="text" id="mHora" style="width:100%;margin-bottom:8px">
      <label class="muted">Nombre</label><input type="text" id="mNombre" style="width:100%;margin-bottom:8px">
    </div>
    <p id="mTexto" style="display:none"></p>
    <p id="mMsg" style="color:#b91c1c;font-size:13px;min-height:16px"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="sec" onclick="cerrar()">Cancelar</button>
      <button id="mOk" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>
<p class="muted">Para ver registros nuevos, recarga la página.</p>
<script>
var DATOS = [], RAW = [], INICIO = '2026-11-16', LISTA = {};
var KEY = new URLSearchParams(location.search).get('key') || '';
var modo = '', filaSel = 0;
var $ = function(i){return document.getElementById(i)};
function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function rango(t){
  var h=new Date(), d=new Date();
  if(t==='hoy'){$('desde').value=$('hasta').value=iso(h)}
  else if(t==='semana'){var w=(h.getDay()+6)%7;d.setDate(h.getDate()-w);$('desde').value=iso(d);$('hasta').value=iso(h)}
  else if(t==='mes'){$('desde').value=iso(new Date(h.getFullYear(),h.getMonth(),1));$('hasta').value=iso(h)}
  else {$('desde').value='';$('hasta').value=''}
  pintar();
}
var filtrado=[];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pintar(){ if(!$('desde').value||$('desde').value<INICIO) $('desde').value=INICIO;
  var d=$('desde').value,h=$('hasta').value,q=$('q').value.trim().toLowerCase();
  filtrado=DATOS.filter(function(r){
    return (!d||r[0]>=d)&&(!h||r[0]<=h)&&(!q||String(r[2]).toLowerCase().indexOf(q)>=0);
  }).sort(function(a,b){return (b[0]+b[1]).localeCompare(a[0]+a[1])});
  var per={},dias={};
  filtrado.forEach(function(r){var k=r[2];per[k]=per[k]||{n:0,u:''};per[k].n++;if(r[0]>per[k].u)per[k].u=r[0];dias[r[0]]=1});
  $('kTotal').textContent=filtrado.length;
  $('kPers').textContent=Object.keys(per).length;
  $('kDias').textContent=Object.keys(dias).length;
  var rs='<tr><th>Nombre</th><th>Días asistidos</th><th>Última</th></tr>';
  Object.keys(per).sort().forEach(function(k){rs+='<tr><td>'+esc(k)+'</td><td>'+per[k].n+'</td><td>'+per[k].u+'</td></tr>'});
  $('resumen').innerHTML=rs;
  var gp={};
  filtrado.forEach(function(r){ if(r[5]){var k=r[0]+'|'+r[5]; gp[k]=gp[k]||{}; gp[k][String(r[2]).toLowerCase()]=r[2];} });
  var dup={}, ah='';
  Object.keys(gp).forEach(function(k){ var ns=Object.keys(gp[k]); if(ns.length>1){ dup[k]=1; ah+='<div>⚠ '+k.split('|')[0]+': un mismo celular marcó para '+ns.map(function(n){return esc(gp[k][n])}).join(', ')+'</div>'; } });
  $('alertas').innerHTML = ah ? '<div style="background:#fee2e2;color:#991b1b;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px"><b>Alertas de posible suplantación</b>'+ah+'</div>' : '';
  var ds='<tr><th>Fecha</th><th>Hora</th><th>Nombre</th><th>Dist. (m)</th><th>Dispositivo</th><th></th></tr>';
  filtrado.forEach(function(r){ds+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td'+(dup[r[0]+'|'+r[5]]?' style="background:#fee2e2" title="Mismo celular marcó para varias personas"':'')+'>'+(dup[r[0]+'|'+r[5]]?'⚠ ':'')+esc(r[2])+'</td><td>'+r[3]+'</td><td style="font-family:monospace">'+(r[5]?esc(String(r[5]).slice(0,6)):'—')+'</td><td style="white-space:nowrap"><button class="sec" onclick="abrir('+r[4]+')">Editar</button> <button style="background:#dc2626" onclick="borrar('+r[4]+')">Borrar</button></td></tr>'});
  $('detalle').innerHTML=ds; renderReporte();
}
function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function partes(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
var PERSONAL = [];
function personalUI() {
  var p = $('personal');
  if (p.style.display === 'block') { p.style.display = 'none'; return; }
  p.style.display = 'block'; p.innerHTML = 'Cargando lista...';
  google.script.run.withSuccessHandler(function (l) { PERSONAL = l; pintarPersonal(); }).withFailureHandler(function (e) { p.innerHTML = 'Error: ' + esc(e.message); }).listaPersonal();
}
function pintarPersonal() {
  var h = '<b>Personal (' + PERSONAL.length + ')</b><p class="muted" style="margin:4px 0 8px">Esta lista es la que aparece en la página de marcar asistencia. Los registros anteriores de una persona eliminada se conservan.</p>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><input id="pN" placeholder="Nombre completo" style="min-width:260px"><select id="pC" style="padding:9px;border:1.5px solid #cbd5e1;border-radius:8px"><option>Piloto</option><option>Auxiliar</option><option>Otro</option></select><button onclick="personalAdd()">+ Agregar persona</button><span id="pMsg" style="font-size:13px;color:#b91c1c"></span></div>';
  h += '<input id="pQ" placeholder="Buscar en la lista..." oninput="pintarPersonalTabla()" style="margin-bottom:8px;min-width:260px"><div class="wrap" style="max-height:40vh"><table id="pT"></table></div>';
  $('personal').innerHTML = h; pintarPersonalTabla();
}
function pintarPersonalTabla() {
  var q = norm($('pQ') ? $('pQ').value : ''), t = '<tr><th>Nombre</th><th>Cargo</th><th></th></tr>';
  PERSONAL.forEach(function (p, i) {
    if (q && norm(p.n).indexOf(q) < 0) return;
    t += '<tr><td>' + esc(p.n) + '</td><td>' + esc(p.c) + '</td><td style="white-space:nowrap"><button class="sec" onclick="personalEdit(' + i + ')">Editar</button> <button style="background:#dc2626" onclick="personalDel(' + i + ')">Eliminar</button></td></tr>';
  });
  $('pT').innerHTML = t;
}
function personalGuardar(lista) {
  var m = $('pMsg'); if (m) { m.style.color = '#475569'; m.textContent = 'Guardando...'; }
  google.script.run.withSuccessHandler(function (l) { PERSONAL = l; refrescarLista(); pintar(); pintarPersonal(); var m2 = $('pMsg'); if (m2) { m2.style.color = '#15803d'; m2.textContent = '✔ Guardado'; } }).withFailureHandler(function (e) { var m2 = $('pMsg'); if (m2) { m2.style.color = '#b91c1c'; m2.textContent = 'Error: ' + e.message; } }).adminPersonal(KEY, lista);
}
function personalAdd() {
  var n = $('pN').value.replace(/\s+/g, ' ').trim(), m = $('pMsg');
  if (n.length < 4 || n.indexOf(' ') === -1) { m.style.color = '#b91c1c'; m.textContent = 'Escribe nombre y apellido.'; return; }
  if (PERSONAL.some(function (p) { return norm(p.n) === norm(n); })) { m.style.color = '#b91c1c'; m.textContent = 'Esa persona ya está en la lista.'; return; }
  personalGuardar(PERSONAL.concat([{ n: n, c: $('pC').value }]));
}
function personalEdit(i) {
  var p = PERSONAL[i]; if (!p) return;
  var n = prompt('Nombre completo:', p.n); if (n === null) return;
  n = n.replace(/\s+/g, ' ').trim(); if (!n) return;
  var c = prompt('Cargo (Piloto, Auxiliar u Otro):', p.c); if (c === null) return;
  personalGuardar(PERSONAL.map(function (x, j) { return j === i ? { n: n, c: c.trim() } : x; }));
}
function personalDel(i) {
  var p = PERSONAL[i]; if (!p) return;
  if (!confirm('¿Eliminar a ' + p.n + ' de la lista de personal? Ya no aparecerá para marcar. Sus registros anteriores se conservan.')) return;
  personalGuardar(PERSONAL.filter(function (x, j) { return j !== i; }));
}
function refrescarLista() {
  LISTA = {}; PERSONAL.forEach(function (p) { LISTA[norm(p.n)] = 1; });
  DATOS = RAW.filter(function (r) { return r[0] >= INICIO && LISTA[norm(r[2])]; });
}
function setDatos(n) { RAW = n; refrescarLista(); }
function reporte(){
  var q=$('q').value.trim().toLowerCase(), hoy=iso(new Date());
  var d=$('desde').value, h=$('hasta').value;
  var nombres={}, primeros={}, marcas={};
  var minF=hoy;
  DATOS.forEach(function(r){
    if(r[0]<minF) minF=r[0];
    if(q && String(r[2]).toLowerCase().indexOf(q)<0) return;
    var k=norm(r[2]); nombres[k]=nombres[k]||r[2];
    if(!primeros[k]||r[0]<primeros[k]) primeros[k]=r[0];
    marcas[k]=marcas[k]||{}; marcas[k][r[0]]=1;
  });
  var desde=d||minF, hasta=h||hoy; if(hasta>hoy) hasta=hoy; if(desde<INICIO) desde=INICIO; PERSONAL.forEach(function(p){ if(q && p.n.toLowerCase().indexOf(q)<0) return; var k=norm(p.n); nombres[k]=nombres[k]||p.n; marcas[k]=marcas[k]||{}; });
  var dias=[], c=partes(desde), fin=partes(hasta), n=0;
  while(c<=fin && n<800){ dias.push(iso(c)); c.setDate(c.getDate()+1); n++; }
  var rows=[];
  Object.keys(marcas).forEach(function(k){
    var m=marcas[k];
    
    var inicio = desde;
    var p={nombre:nombres[k], habiles:0, asistio:0, faltas:[], domingos:[], estado:{}};
    dias.forEach(function(x){
      var dw=partes(x).getDay();
      if(dw===0){ if(m[x]){p.domingos.push(x); p.estado[x]='DOMINGO (pago extra)';} else p.estado[x]=''; return; }
      if(x<inicio){ p.estado[x]='-'; return; }
      if(m[x]){ p.habiles++; p.asistio++; p.estado[x]='ASISTIO'; }
      else if(x<hoy){ p.habiles++; p.faltas.push(x); p.estado[x]='FALTA'; }
      else { p.estado[x]='pendiente'; }
    });
    rows.push(p);
  });
  rows.sort(function(a,b){return b.faltas.length-a.faltas.length || a.nombre.localeCompare(b.nombre)});
  return {desde:desde, hasta:hasta, dias:dias, rows:rows};
}
var DN = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
function renderReporte() {
  var R = reporte(), el = $('reporte');
  if (!R.rows.length) { el.innerHTML = ''; return; }
  var sem = [];
  R.dias.forEach(function (x) {
    var d = partes(x), w = (d.getDay() + 6) % 7, l = new Date(d); l.setDate(d.getDate() - w);
    var k = iso(l), g = sem[sem.length - 1];
    if (!g || g.k !== k) { g = { k: k, n: 0 }; sem.push(g); }
    g.n++;
  });
  var tF = 0, tD = 0, sinF = 0;
  R.rows.forEach(function (p) { tF += p.faltas.length; tD += p.domingos.length; if (!p.faltas.length) sinF++; });
  var h = '<h2>Asistencia semanal (' + R.desde + ' a ' + R.hasta + ')</h2>';
  h += '<div class="kpis" style="margin:6px 0"><div class="kpi"><b style="color:#b91c1c">' + tF + '</b>faltas (lun-sáb)</div><div class="kpi"><b style="color:#15803d">' + sinF + '</b>sin ninguna falta</div><div class="kpi"><b style="color:#1d4ed8">' + tD + '</b>domingos trabajados (doble)</div></div>';
  h += '<p class="muted" style="margin:0 0 6px"><span style="background:#dcfce7;color:#166534;padding:1px 6px;border-radius:6px">✔ asistió</span> <span style="background:#fecaca;color:#b91c1c;padding:1px 6px;border-radius:6px">✘ falta</span> <span style="background:#bfdbfe;color:#1e3a8a;padding:1px 6px;border-radius:6px">★ domingo trabajado = doble</span> <span style="background:#f1f5f9;padding:1px 6px;border-radius:6px">dom. sin marcar = se paga normal</span> · Lunes a sábado es obligatorio. Solo el día de hoy no cuenta como falta. Conteo iniciado el 16/11/2026, solo con el personal de la lista.</p>';
  h += '<div class="wrap" style="max-height:70vh"><table style="border-collapse:separate;border-spacing:0"><tr><th rowspan="2" style="position:sticky;left:0;z-index:3">Nombre</th>';
  sem.forEach(function (g) { var d = partes(g.k); h += '<th colspan="' + g.n + '" style="text-align:center;border-left:2px solid #fff">Semana del ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '</th>'; });
  h += '<th rowspan="2">Asistió</th><th rowspan="2">Faltas</th><th rowspan="2">% asist.</th><th rowspan="2">Domingos dobles</th></tr><tr>';
  R.dias.forEach(function (x) { var d = partes(x), dw = d.getDay(); h += '<th style="text-align:center;font-size:11px;padding:4px 6px;' + (dw === 1 ? 'border-left:2px solid #fff;' : '') + (dw === 0 ? 'background:#1e3a8a;' : '') + '">' + DN[dw] + '<br>' + d.getDate() + '</th>'; });
  h += '</tr>';
  R.rows.forEach(function (p) {
    var pc = p.habiles ? Math.round(100 * p.asistio / p.habiles) : 100;
    h += '<tr><td style="position:sticky;left:0;background:#fff;font-weight:600;white-space:nowrap">' + esc(p.nombre) + '</td>';
    R.dias.forEach(function (x) {
      var e = p.estado[x], dw = partes(x).getDay(), bl = dw === 1 ? 'border-left:2px solid #e2e8f0;' : '';
      var st = 'text-align:center;padding:4px 6px;font-size:13px;' + bl, tx = '';
      if (e === 'ASISTIO') { st += 'background:#dcfce7;color:#166534'; tx = '✔'; }
      else if (e === 'FALTA') { st += 'background:#fecaca;color:#b91c1c;font-weight:700'; tx = '✘'; }
      else if (e === 'DOMINGO (pago extra)') { st += 'background:#bfdbfe;color:#1e3a8a;font-weight:700'; tx = '★'; }
      else if (dw === 0) { st += 'background:#f1f5f9;color:#94a3b8;font-size:11px'; tx = 'pago'; }
      else if (e === 'pendiente') { st += 'color:#94a3b8'; tx = '…'; }
      else { st += 'color:#cbd5e1'; tx = '·'; }
      h += '<td style="' + st + '" title="' + x + '">' + tx + '</td>';
    });
    h += '<td style="text-align:center">' + p.asistio + '/' + p.habiles + '</td><td style="text-align:center;' + (p.faltas.length ? 'color:#b91c1c;font-weight:700' : '') + '">' + p.faltas.length + '</td><td style="text-align:center">' + pc + '%</td><td style="text-align:center;' + (p.domingos.length ? 'color:#1d4ed8;font-weight:700' : '') + '">' + p.domingos.length + '</td></tr>';
  });
  h += '</table></div>';
  el.innerHTML = h;
}
function reporteCsv(){
  var R=reporte();
  var q=function(v){return '"'+String(v).replace(/"/g,'""')+'"'};
  var head=['Nombre','Dias habiles (lun-sab)','Asistio','Faltas','% asistencia','Domingos trabajados (pago extra)','Fechas de falta'].concat(R.dias);
  var lines=[head.map(q).join(',')];
  R.rows.forEach(function(p){
    var pc=p.habiles?Math.round(100*p.asistio/p.habiles):100;
    var row=[p.nombre,p.habiles,p.asistio,p.faltas.length,pc+'%',p.domingos.length,p.faltas.join(' ')].concat(R.dias.map(function(x){return p.estado[x]}));
    lines.push(row.map(q).join(','));
  });
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('﻿'+lines.join('\n'));
  a.download='reporte_asistencia_'+R.desde+'_a_'+R.hasta+'.csv'; a.click();
}
function csv(){
  var t='Fecha,Hora,Nombre,Distancia,Dispositivo\n'+filtrado.map(function(r){return [r[0],r[1],'"'+String(r[2]).replace(/"/g,'""')+'"',r[3],r[5]||''].join(',')}).join('\n');
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('﻿'+t);
  a.download='asistencia.csv';a.click();
}
function buscar(f){return DATOS.filter(function(x){return x[4]===f})[0]}
function abrir(f){
  modo = f ? 'editar' : 'agregar'; filaSel = f;
  var r = f ? buscar(f) : null;
  $('mTitulo').textContent = f ? 'Editar asistencia' : 'Agregar asistencia';
  $('mFecha').value = r ? r[0] : iso(new Date());
  $('mHora').value = r ? r[1] : '08:00:00';
  $('mNombre').value = r ? r[2] : '';
  $('mCampos').style.display = 'block'; $('mTexto').style.display = 'none';
  $('mOk').textContent = 'Guardar'; $('mOk').style.background = '#2563eb';
  $('mMsg').textContent = ''; $('modal').style.display = 'flex';
}
function borrar(f){
  var r = buscar(f); modo = 'borrar'; filaSel = f;
  $('mTitulo').textContent = 'Borrar asistencia';
  $('mCampos').style.display = 'none'; $('mTexto').style.display = 'block';
  $('mTexto').textContent = '¿Borrar la asistencia de ' + r[2] + ' del ' + r[0] + ' ' + r[1] + '? No se puede deshacer.';
  $('mOk').textContent = 'Sí, borrar'; $('mOk').style.background = '#dc2626';
  $('mMsg').textContent = ''; $('modal').style.display = 'flex';
}
function cerrar(){ $('modal').style.display = 'none'; }
function guardar(){
  var ok = $('mOk'); ok.disabled = true; $('mMsg').textContent = 'Guardando...';
  var run = google.script.run
    .withSuccessHandler(function(nuevos){ setDatos(nuevos); ok.disabled = false; cerrar(); pintar(); })
    .withFailureHandler(function(e){ ok.disabled = false; $('mMsg').textContent = (e && e.message) || String(e); });
  if (modo === 'borrar') run.adminBorrar(KEY, filaSel);
  else if (modo === 'editar') run.adminEditar(KEY, filaSel, $('mFecha').value, $('mHora').value, $('mNombre').value);
  else run.adminAgregar(KEY, $('mFecha').value, $('mHora').value, $('mNombre').value);
}
['desde','hasta','q'].forEach(function(i){$(i).addEventListener('input',pintar)});
$('detalle').innerHTML='<tr><td>Cargando...</td></tr>';
google.script.run
  .withSuccessHandler(function(r){ RAW = r; google.script.run.withSuccessHandler(function (l) { PERSONAL = l; refrescarLista(); rango('mes'); }).withFailureHandler(function (e) { $('detalle').innerHTML = '<tr><td style="color:#b91c1c">No se pudo cargar la lista de personal: ' + esc(e.message) + '</td></tr>'; }).listaPersonal(); })
  .withFailureHandler(function(e){ $('detalle').innerHTML='<tr><td style="color:#b91c1c">No se pudo cargar: '+esc((e&&e.message)||e)+'</td></tr>'; })
  .adminHistorial(KEY);
</script>
